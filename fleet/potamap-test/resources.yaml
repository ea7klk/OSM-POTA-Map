apiVersion: apps/v1
kind: Deployment
metadata:
  name: potamap-test
  namespace: potamap
  labels:
    app.kubernetes.io/name: potamap-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: potamap-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: potamap-test
    spec:
      automountServiceAccountToken: false
      containers:
        - name: potamap-test
          image: ghcr.io/ea7klk/osm-pota-map:test
          imagePullPolicy: Always
          workingDir: /usr/share/nginx/html
          ports:
            - name: http
              containerPort: 80
          env:
            - name: OVERPASS_URL
              value: https://api.spainip.es/v1/overpass/interpreter
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 180
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: potamap-test
  namespace: potamap
spec:
  selector:
    app.kubernetes.io/name: potamap-test
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: potamap-test
  namespace: potamap
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`potamap.test.ea7klk.es`)
      services:
        - name: potamap-test
          port: 3000
  tls:
    certResolver: acmeresolver
