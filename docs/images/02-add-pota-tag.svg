<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Add the POTA tag to the park relation</title>
  <desc id="desc">Illustration of the iD All tags panel showing the existing park tags and the new communication amateur radio POTA tag with value ES-0142.</desc>
  <rect width="1200" height="650" fill="#eef1f3"/>
  <rect x="0" y="0" width="1200" height="48" fill="#354c5b"/>
  <text x="24" y="30" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="700">iD · Edit feature</text>
  <rect x="0" y="48" width="1200" height="602" fill="#e9eee8"/>
  <g fill="none" stroke="#fff" stroke-width="7"><path d="M348 492 C470 390 530 366 650 292 S839 229 947 166 1061 171 1180 118"/><path d="M401 568 C544 480 649 475 734 383 S942 345 1170 270"/><path d="M380 189 C471 244 550 247 660 221 S881 263 1012 218 1117 237 1191 300"/></g>
  <path d="M605 143 C690 105 783 143 829 181 C877 221 1000 204 1051 275 C1080 316 1058 388 1008 429 C954 476 879 519 798 505 C709 489 633 443 594 385 C554 325 543 223 605 143Z" fill="#8fbd87" fill-opacity=".33" stroke="#217f52" stroke-width="4"/>
  <rect x="20" y="70" width="505" height="536" rx="6" fill="#fff" stroke="#cbd3d8"/>
  <text x="48" y="111" font-family="Arial,sans-serif" font-size="13" fill="#69808b" font-weight="700" letter-spacing="1">RELATION 2064676</text>
  <text x="48" y="148" font-family="Arial,sans-serif" font-size="22" fill="#263943" font-weight="700">All tags</text>
  <text x="48" y="178" font-family="Arial,sans-serif" font-size="13" fill="#596f79">Add one tag; keep the existing park tags.</text>
  <rect x="48" y="201" width="449" height="38" fill="#eef2f4"/>
  <text x="62" y="226" font-family="Arial,sans-serif" font-size="13" fill="#445963" font-weight="700">KEY</text>
  <text x="304" y="226" font-family="Arial,sans-serif" font-size="13" fill="#445963" font-weight="700">VALUE</text>
  <g font-family="Arial,sans-serif" font-size="13" fill="#384f59">
    <rect x="48" y="239" width="449" height="43" fill="#fff" stroke="#e3e8eb"/><text x="62" y="266">boundary</text><text x="304" y="266">protected_area</text>
    <rect x="48" y="282" width="449" height="43" fill="#f9fafb" stroke="#e3e8eb"/><text x="62" y="309">leisure</text><text x="304" y="309">nature_reserve</text>
    <rect x="48" y="325" width="449" height="43" fill="#fff" stroke="#e3e8eb"/><text x="62" y="352">name</text><text x="304" y="352">Parc Natural …</text>
  </g>
  <rect x="48" y="379" width="449" height="70" rx="3" fill="#e8f5eb" stroke="#19804b" stroke-width="3"/>
  <text x="62" y="406" font-family="Arial,sans-serif" font-size="12" fill="#2d5940" font-weight="700">communication:amateur_radio:pota</text>
  <text x="62" y="432" font-family="Arial,sans-serif" font-size="15" fill="#174c2d" font-weight="700">ES-0142</text>
  <circle cx="75" cy="486" r="15" fill="#16824d"/><text x="75" y="492" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#fff" font-weight="700">+</text>
  <text x="102" y="491" font-family="Arial,sans-serif" font-size="14" fill="#3e5a64">Add another tag row</text>
  <rect x="611" y="79" width="520" height="92" rx="8" fill="#fff" stroke="#286b8a" stroke-width="2"/>
  <text x="635" y="111" font-family="Arial,sans-serif" font-size="16" fill="#214d62" font-weight="700">Use this exact key and reference</text>
  <text x="635" y="140" font-family="Arial,sans-serif" font-size="14" fill="#526b76">The map searches communication:amateur_radio:pota.</text>
  <path d="M647 171 L494 389" fill="none" stroke="#286b8a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="611" y="531" width="520" height="58" rx="7" fill="#fff" stroke="#b8c8ce"/>
  <text x="635" y="566" font-family="Arial,sans-serif" font-size="14" fill="#344f5c">Do not add the tag to each member boundary way.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#286b8a"/></marker></defs>
</svg>
