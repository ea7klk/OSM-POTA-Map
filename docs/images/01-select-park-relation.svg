  <path d="M529 238 C585 190 693 187 765 214 C835 241 941 231 1008 275 C1054 305 1036 382 1008 421 C969 476 925 521 857 538 C777 557 695 529 638 493 C574 453 504 419 481 360 C461 309 489 272 529 238Z" fill="#8fbd87" fill-opacity=".35" stroke="#217f52" stroke-width="5"/>
  <path d="M632 340 C658 316 700 316 720 343 C740 371 718 404 684 410 C652 415 619 382 632 340Z" fill="#d8e6eb" stroke="#a9c6d0" stroke-width="2"/>
