<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Select the existing park relation in iD</title>
  <desc id="desc">Illustration of OpenStreetMap iD with the existing nature park relation selected and its relation identifier shown in the feature panel.</desc>
  <rect width="1200" height="650" fill="#f2f4f6"/>
  <rect x="0" y="0" width="1200" height="48" fill="#354c5b"/>
  <circle cx="28" cy="24" r="13" fill="#8bb3c9"/><path d="M21 24h14M28 17v14" stroke="#fff" stroke-width="2"/>
  <text x="52" y="30" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="700">OpenStreetMap</text>
  <text x="940" y="30" font-family="Arial,sans-serif" font-size="14" fill="#e8eef1">Edit with iD</text>
  <rect x="0" y="48" width="1200" height="42" fill="#fff" stroke="#d3d9dd"/>
  <text x="20" y="75" font-family="Arial,sans-serif" font-size="15" fill="#263943">Sant Llorenç del Munt i l'Obac Nature Park</text>
  <rect x="0" y="90" width="350" height="560" fill="#fff" stroke="#d3d9dd"/>
  <rect x="0" y="90" width="54" height="560" fill="#f6f7f8" stroke="#d3d9dd"/>
  <g fill="#647681" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">
    <text x="27" y="133">⌖</text><text x="27" y="184">＋</text><text x="27" y="235">↶</text><text x="27" y="286">↷</text><text x="27" y="337">?</text>
  </g>
  <text x="76" y="130" font-family="Arial,sans-serif" font-size="13" fill="#60737d" font-weight="700" letter-spacing="1">SELECTED FEATURE</text>
  <text x="76" y="166" font-family="Arial,sans-serif" font-size="23" fill="#243b49" font-weight="700">Nature reserve</text>
  <text x="76" y="196" font-family="Arial,sans-serif" font-size="14" fill="#485d67">Parc Natural de Sant Llorenç</text>
  <text x="76" y="217" font-family="Arial,sans-serif" font-size="14" fill="#485d67">del Munt i l'Obac</text>
  <line x1="72" y1="240" x2="330" y2="240" stroke="#e0e5e8"/>
  <text x="76" y="269" font-family="Arial,sans-serif" font-size="13" fill="#60737d">BOUNDARY</text>
  <text x="76" y="292" font-family="Arial,sans-serif" font-size="15" fill="#263943">Protected area</text>
  <text x="76" y="321" font-family="Arial,sans-serif" font-size="13" fill="#60737d">RELATIONS</text>
  <rect x="72" y="337" width="254" height="82" rx="5" fill="#eaf4f8" stroke="#4d91b0" stroke-width="2"/>
  <text x="86" y="362" font-family="Arial,sans-serif" font-size="14" fill="#164e68" font-weight="700">Multipolygon relation</text>
  <text x="86" y="386" font-family="Arial,sans-serif" font-size="13" fill="#28586c">2064676 · whole park</text>
  <text x="86" y="405" font-family="Arial,sans-serif" font-size="12" fill="#54717d">9 boundary members</text>
  <rect x="350" y="90" width="850" height="560" fill="#e9eee8"/>
