  <text x="800" y="136" font-family="Arial,sans-serif" font-size="14" fill="#214d62" font-weight="700">Select the feature representing the whole park</text>
  <text x="800" y="155" font-family="Arial,sans-serif" font-size="12" fill="#526b76">Use the relation, not a single boundary segment.</text>
  <path d="M813 168 L768 216" fill="none" stroke="#286b8a" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="780" cy="222" r="7" fill="#fff" stroke="#286b8a" stroke-width="3"/>
  <rect x="680" y="574" width="472" height="45" rx="6" fill="#fff" stroke="#b8c8ce"/>
  <text x="700" y="602" font-family="Arial,sans-serif" font-size="14" fill="#344f5c">Illustration only · map shape is schematic, not park data</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#286b8a"/></marker></defs>
